<div class="lang-toggle" dir="ltr" (click)="toggle()">
  <span class="lang-option" [class.active]="isRTL()">
    <span class="lang-text">AR</span>
  </span>
  <span class="lang-option" [class.active]="!isRTL()">
    <span class="lang-text">EN</span>
  </span>
  <span class="slider" [class.rtl]="isRTL()"></span>
</div>
