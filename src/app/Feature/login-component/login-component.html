<div
  class="login-page-container d-flex flex-column min-vh-100"
  [attr.dir]="lang.dir()"
  [class.page-rtl]="lang.isRTL()"
  [class.page-ltr]="!lang.isRTL()"
  style="background-color: #f8fafc;"
>
  <div class="container d-flex align-items-center justify-content-center flex-grow-1 login-wrapper my-4">
  <div class="card card--glass fancy-card shadow-sm login-card">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="brand fs-2 fw-bold">
          <span class="brand-n">N</span>
          <span class="brand-text">{{ 'brandSuffix' | t }}</span>
        </div>
        <div class="text-muted small">{{ 'signInToContinue' | t }}</div>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <!-- Username -->
        <div class="mb-3">
          <label class="form-label">{{ 'username' | t }}</label>
          <input
            class="form-control"
            type="text"
            formControlName="username"
            [placeholder]="'usernamePh' | t"
          />
          <div
            class="invalid-feedback d-block"
            *ngIf="form.controls.username.touched && form.controls.username.invalid"
          >
            {{ 'usernameRequired' | t }}
          </div>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label class="form-label">{{ 'password' | t }}</label>
          <div class="input-group">
            <input
              class="form-control"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              [placeholder]="'passwordPh' | t"
            />
            <button
              type="button"
              class="btn btn-outline-secondary"
              (click)="showPassword = !showPassword"
              tabindex="-1"
            >
              <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
            </button>
          </div>
          <div
            class="invalid-feedback d-block"
            *ngIf="form.controls.password.touched && form.controls.password.invalid"
          >
            {{ 'passwordRequired' | t }}
          </div>
        </div>

        <!-- Gate fields موجودة في الفورم بس UI متشال حالياً -->
        <!--
        <div *ngIf="roleIsGateCashier()" class="row">
          <div class="col-12 col-md-6 mb-3">
            <label class="form-label">{{ 'gateType' | t }}</label>
            <select class="form-select" formControlName="gateType">
              <option [ngValue]="GateType.Entrance">{{ 'entryGate' | t }}</option>
              <option [ngValue]="GateType.Exit">{{ 'exitGate' | t }}</option>
            </select>
            <div
              class="invalid-feedback d-block"
              *ngIf="form.controls.gateType.touched && form.controls.gateType.invalid"
            >
              {{ 'gateTypeRequired' | t }}
            </div>
          </div>

          <div class="col-12 col-md-6 mb-3">
            <label class="form-label">{{ 'gateNumber' | t }}</label>
            <input
              class="form-control"
              type="number"
              min="1"
              formControlName="gateNumber"
              [placeholder]="'gateNumberPh' | t"
            />
            <div
              class="invalid-feedback d-block"
              *ngIf="form.controls.gateNumber.touched && form.controls.gateNumber.invalid"
            >
              {{ 'gateNumberRequired' | t }}
            </div>
          </div>
        </div>
        -->

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              id="remember"
              formControlName="remember"
            />
            <label class="form-check-label" for="remember">
              {{ 'rememberMe' | t }}
            </label>
          </div>
          <a class="small text-decoration-none" routerLink="/forgot-password">
            {{ 'forgotPassword' | t }}
          </a>
        </div>

        <button class="btn btn-primary w-100" [disabled]="loading">
          <span *ngIf="!loading">{{ 'signIn' | t }}</span>
          <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
        </button>

        <div *ngIf="errorToast" class="alert alert-danger mt-3 mb-0">
          {{ errorToast }}
        </div>
      </form>
    </div>
  </div>
</div>

<app-footer-component></app-footer-component>
</div>

<!-- First-time change modal (Popup + Backdrop) -->
<div *ngIf="showChangeModal" class="change-modal-backdrop" role="dialog" aria-modal="true">
  <div class="change-modal-card">
    <div class="change-modal-header">
      <h5 class="change-modal-title">{{ 'changeAdminCreds' | t }}</h5>

      <button
        type="button"
        class="change-modal-close"
        (click)="showChangeModal = false"
        [disabled]="changeLoading"
        aria-label="Close"
      >
        &times;
      </button>
    </div>

    <p class="change-modal-subtitle">
      {{ 'tempPasswordNotice' | t }}
    </p>

    <form [formGroup]="changeForm" (ngSubmit)="saveNewCredentials()">
      <!-- UserName -->
      <div class="mb-3">
        <label class="form-label small">{{ 'username' | t }}</label>
        <input
          class="form-control form-control-sm"
          type="text"
          formControlName="userName"
          autocomplete="off"
        />
      </div>

      <!-- Old Password -->
      <div class="mb-3">
        <label class="form-label small">{{ 'password' | t }}</label>
        <div class="password-wrapper">
          <input
            class="form-control form-control-sm"
            [type]="showOldPwd ? 'text' : 'password'"
            formControlName="password"
            autocomplete="off"
          />
          <button type="button" class="eye-btn" (click)="showOldPwd = !showOldPwd">
            <i [class]="showOldPwd ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </button>
        </div>
      </div>

      <!-- New Password -->
      <div class="mb-3">
        <label class="form-label small">{{ 'newPassword' | t }}</label>
        <div class="password-wrapper">
          <input
            class="form-control form-control-sm"
            [type]="showNewPwd ? 'text' : 'password'"
            formControlName="newPassword"
            autocomplete="off"
          />
          <button type="button" class="eye-btn" (click)="showNewPwd = !showNewPwd">
            <i [class]="showNewPwd ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="mb-3">
        <label class="form-label small">{{ 'confirmPassword' | t }}</label>
        <div class="password-wrapper">
          <input
            class="form-control form-control-sm"
            [type]="showConfirmPwd ? 'text' : 'password'"
            formControlName="confirmPassword"
            autocomplete="off"
          />
          <button type="button" class="eye-btn" (click)="showConfirmPwd = !showConfirmPwd">
            <i [class]="showConfirmPwd ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </button>
        </div>
      </div>

      <div *ngIf="changeForm.hasError('mismatch')" class="alert alert-danger small mt-2">
        {{ 'pwdMismatch' | t }}
      </div>

      <div *ngIf="changeError" class="alert alert-danger small mt-2">
        {{ changeError }}
      </div>

      <div class="change-modal-footer">
        <button
          type="button"
          class="btn btn-outline-secondary btn-sm"
          (click)="showChangeModal = false"
          [disabled]="changeLoading"
        >
          {{ 'cancel' | t }}
        </button>
        <button type="submit" class="btn btn-success btn-sm" [disabled]="changeLoading">
          <span *ngIf="!changeLoading">{{ 'save' | t }}</span>
          <span *ngIf="changeLoading" class="spinner-border spinner-border-sm"></span>
        </button>
      </div>
    </form>
  </div>
</div>

<app-gate-component *ngIf="showGatePopup"></app-gate-component>
