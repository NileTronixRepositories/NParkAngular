<div
  class="exit-theme container-fluid px-2 px-sm-3"
  [attr.dir]="lang.dir()"
  [class.page-rtl]="lang.isRTL()"
  [class.page-ltr]="!lang.isRTL()"
>
  <!-- Page Header -->
  <div class="page-header mb-3 fade-in-down p-2 px-3 rounded-3 shadow-sm">
    <div
      class="d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between gap-3"
    >
      <div class="d-flex align-items-center gap-2 gap-sm-3 min-w-0">
        <div class="header-icon-wrapper d-flex align-items-center justify-content-center rounded-3">
          <i class="bi bi-box-arrow-left header-icon fs-5"></i>
        </div>
        <div class="min-w-0">
          <h1 class="page-title mb-0 flex-wrap">
            {{ t('exitTicket') }}
            <span class="gate-badge ms-2" *ngIf="gatePeripheral?.gateNumber">
              <span class="gate-label">{{ t('gate') }}</span>
              <span class="gate-value">{{ gatePeripheral?.gateNumber }}</span>
            </span>
            <span class="badge bg-warning text-dark ms-2" *ngIf="isSupervisor">
              <i class="bi bi-shield-check me-1"></i>{{ t('supervisor_mode') }}
            </span>
          </h1>
          <p class="page-subtitle mb-0 text-truncate">{{ t('ticketsExit') }}</p>
        </div>
      </div>

      <!-- Quick Search in Header -->
      <div class="ms-md-auto me-md-3 search-header-container">
        <app-search-block-component
          [isCompact]="true"
          [placeholder]="t('search_tickets_placeholder')"
          [searching]="searchingTickets"
          [results]="searchResults"
          (searchQuery)="onSearchTickets($event)"
          (resultSelected)="onTicketSelected($event)"
        ></app-search-block-component>
      </div>

      <div class="d-flex align-items-center gap-2 align-self-stretch align-self-md-auto">
        <button
          type="button"
          class="btn btn-outline-light rounded-pill btn-sm d-flex align-items-center justify-content-center gap-2 btn-help-tour flex-grow-1 flex-md-grow-0"
          (click)="startTour()"
        >
          <i class="bi bi-question-circle"></i>
          <span>{{ 'helpTour' | t }}</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 4-block grid: xs=1col | md=2col | xl=3col -->
  <div class="row g-2 g-lg-3">
    <!-- Block 1: Gate Devices -->
    <div class="col-12 col-md-6 col-xl-3">
      <app-exit-gate-devices-block-component
        [gatePeripheral]="gatePeripheral"
        [scannedFile]="scannedFile"
        (searchTicketNumber)="onSearchTicketNumber($event)"
        (vehicleDetected)="onDetectedVehicleNumber($event)"
      ></app-exit-gate-devices-block-component>
    </div>

    <!-- Block 2: Exit Validation -->
    <div class="col-12 col-md-6 col-xl-3">
      <app-exit-validation-block-component
        [detectedVehicleNumber]="detectedVehicleNumber"
        [vehicleValidationLoading]="vehicleValidationLoading"
        [textValidationLoading]="textValidationLoading || lprMembershipLoading"
        [openGateLoading]="validationOpenGateLoading || addingExitTicket"
        [gateConnectionReady]="isExitGateConnectionReady"
        [vehicleResult]="vehicleValidationResult"
        [textResult]="textValidationResult"
        [validationMessage]="validationMessage"
        [validationError]="validationError || validationOpenGateError || gateConnectionError"
        [clearTextNonce]="clearValidationTextNonce"
        [focusTextNonce]="focusValidationTextNonce"
        [setTextNonce]="setValidationTextNonce"
        [textValue]="validationTextValue"
        (validateText)="onValidateExitByText($event)"
        (confirmExit)="onConfirmValidationExit($event)"
      ></app-exit-validation-block-component>
    </div>

    <!-- Block 3: Tickets Table -->
    <div class="col-12 col-xl-3">
      <app-exit-tickets-table-block-component
        [tickets]="filtered"
        [page]="page"
        [pageSize]="pageSize"
        [loading]="loading"
        [totalPriceToday]="totalPriceToday"
        [collectSummary]="collectSummary"
        [collectLoading]="collectLoading"
        [supervisorCollectLoading]="supervisorCollectLoading"
        [supervisorCollectError]="supervisorCollectError"
        [showSupervisorCollectModal]="showSupervisorCollectModal"
        [supervisorUsername]="supervisorUsername"
        [supervisorPassword]="supervisorPassword"
        (pageChange)="page = $event"
        (collectClick)="onCollectClick()"
        (collectSummaryClose)="collectSummary = null"
        (supervisorUsernameChange)="supervisorUsername = $event"
        (supervisorPasswordChange)="supervisorPassword = $event"
        (submitSupervisorCollect)="submitSupervisorCollect()"
        (closeSupervisorCollectModal)="closeSupervisorCollectModal()"
        (finishSupervisorCollect)="finishSupervisorCollect()"
        (ticketSelected)="onTicketSelected($event)"
      ></app-exit-tickets-table-block-component>
    </div>
  </div>

  <!-- Supervisor Login Modal (Global Context Shared) -->
  <app-supervisor-modal-block-component
    [show]="showSupervisorCollectModal && !collectSummary"
    [loading]="supervisorCollectLoading"
    [error]="supervisorCollectError"
    [(username)]="supervisorUsername"
    [(password)]="supervisorPassword"
    (submit)="submitSupervisorCollect()"
    (close)="closeSupervisorCollectModal()"
  ></app-supervisor-modal-block-component>

  <!-- Ticket Details Modal (Fixed positioning) -->
  <app-ticket-details-modal-block-component
    [show]="showTicketDetailsModal"
    [ticket]="selectedTicketForModal"
    (close)="closeTicketDetailsModal()"
  ></app-ticket-details-modal-block-component>
</div>
