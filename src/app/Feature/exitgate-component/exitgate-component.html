<div
  class="exit-theme container-fluid"
  [attr.dir]="lang.dir()"
  [class.page-rtl]="lang.isRTL()"
  [class.page-ltr]="!lang.isRTL()"
>
  <div class="row g-3 mb-3">
    <!-- Block 1: Gate Devices + Manual Plate -->
    <div class="col-12 col-lg-4">
      <app-exit-gate-devices-block-component
        [gatePeripheral]="gatePeripheral"
      ></app-exit-gate-devices-block-component>
    </div>

    <!-- Block 2: Scan & Collect (Exit) -->
    <div class="col-12 col-lg-4">
      <app-exit-scan-collect-block-component
        [scanningQR]="scanningQR"
        [scanning]="scanning"
        [readingCard]="readingCard"
        [(scanBuffer)]="scanBuffer"
        [(manualInput)]="manualInput"
        [searchingManual]="searchingManual"
        [scannedTicket]="scannedTicket"
        [salarySummary]="salarySummary"
        [addingExitTicket]="addingExitTicket"
        [exitTicketAdded]="exitTicketAdded"
        [collecting]="collecting"
        [exitProcessing]="exitProcessing"
        [collectingCashier]="collectingCashier"
        [cashierConfirming]="cashierConfirming"
        (scanQrClick)="scanQRCode()"
        (readCardClick)="readCard()"
        (submitQrClick)="submitQrFromInput()"
        (manualSearchClick)="searchManual()"
        (addExitTicketClick)="addExitTicket($event)"
        (confirmExitClick)="confirmExit()"
        (printSummaryClick)="printSummary()"
        (allowExitWithoutCollectClick)="allowExitWithoutCollect()"
        (collectCashierClick)="collectCashier()"
        (confirmCashierClicked)="collectCashier()"
      ></app-exit-scan-collect-block-component>
    </div>

    <!-- Block 3: Tickets table (OUT) + Collect Today + Supervisor Modal -->
    <div class="col-12 col-lg-4">
      <app-exit-tickets-table-block-component
        [tickets]="filtered"
        [page]="page"
        [pageSize]="pageSize"
        [loading]="loading"
        [totalPriceToday]="totalPriceToday"
        [collectSummary]="collectSummary"
        [collectLoading]="collectLoading"
        [supervisorCollectLoading]="supervisorCollectLoading"
        [supervisorCollectError]="supervisorCollectError"
        [showSupervisorCollectModal]="showSupervisorCollectModal"
        [supervisorUsername]="supervisorUsername"
        [supervisorPassword]="supervisorPassword"
        (pageChange)="page = $event"
        (collectClick)="onCollectClick()"
        (collectSummaryClose)="collectSummary = null"
        (supervisorUsernameChange)="supervisorUsername = $event"
        (supervisorPasswordChange)="supervisorPassword = $event"
        (submitSupervisorCollect)="submitSupervisorCollect()"
        (closeSupervisorCollectModal)="closeSupervisorCollectModal()"
        (finishSupervisorCollect)="finishSupervisorCollect()"
      ></app-exit-tickets-table-block-component>
    </div>
  </div>
</div>
