<div
  class="exit-theme container-fluid px-3 px-md-4"
  [attr.dir]="lang.dir()"
  [class.page-rtl]="lang.isRTL()"
  [class.page-ltr]="!lang.isRTL()"
>
  <!-- Page Header -->
  <div class="page-header mb-4 fade-in-down p-3 rounded-4 shadow-sm">
    <div class="d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between gap-3">
      <div class="d-flex align-items-center gap-3">
        <div class="header-icon-wrapper d-flex align-items-center justify-content-center rounded-3">
          <i class="bi bi-box-arrow-left header-icon fs-5"></i>
        </div>
        <div>
          <h1 class="page-title mb-0">
            {{ t('exitTicket') }}
            <span class="gate-badge ms-2" *ngIf="gatePeripheral?.gateNumber">
              <span class="gate-label">{{ t('gate') }}</span>
              <span class="gate-value">{{ gatePeripheral?.gateNumber }}</span>
            </span>
          </h1>
          <p class="page-subtitle mb-0">{{ t('ticketsExit') }}</p>
        </div>
      </div>

      <!-- Quick Search in Header -->
      <div class="ms-md-auto me-md-3">
        <app-search-block-component
          [isCompact]="true"
          [placeholder]="t('search_tickets_placeholder')"
          [searching]="searchingTickets"
          [results]="searchResults"
          (searchQuery)="onSearchTickets($event)"
          (resultSelected)="onTicketSelected($event)"
        ></app-search-block-component>
      </div>

      <!-- Tour Button -->
      <button
        type="button"
        class="btn btn-outline-light rounded-pill btn-sm d-flex align-items-center justify-content-center gap-2 btn-help-tour align-self-stretch align-self-md-auto"
        (click)="startTour()"
      >
        <i class="bi bi-question-circle"></i>
        <span>{{ t('guide_tour') }}</span>
      </button>
    </div>
  </div>

  <!-- 4-block grid: xs=1col | md=2col | xl=4col -->
  <div class="row g-3">
    <!-- Block 1: Gate Devices -->
    <div class="col-12 col-md-6 col-lg-4">
      <app-exit-gate-devices-block-component
        [gatePeripheral]="gatePeripheral"
        [scannedFile]="scannedFile"
        (searchTicketNumber)="onSearchTicketNumber($event)"
      ></app-exit-gate-devices-block-component>
    </div>

    <!-- Block 2: Scan & Collect -->
    <div class="col-12 col-md-6 col-lg-4">
      <app-exit-scan-collect-block-component
        [universalInput]="universalInput"
        (universalInputChange)="onUniversalInputChange($event)"
        (submitInputClick)="onUniversalInputSubmit()"
        [readingCard]="readingCard"
        [searchingManual]="searchingManual"
        [scannedTicket]="scannedTicket"
        [salarySummary]="salarySummary"
        [addingExitTicket]="addingExitTicket"
        [exitTicketAdded]="exitTicketAdded"
        [collecting]="collecting"
        [exitProcessing]="exitProcessing"
        [collectingCashier]="collectingCashier"
        [cashierConfirming]="cashierConfirming"
        [allSanctions]="allSanctions"
        [selectedSanctionIds]="selectedSanctionIds"
        (toggleSanction)="onToggleSanction($event)"
        (scanQrClick)="scanQRCode()"
        (readCardClick)="readCard()"
        (addExitTicketClick)="addExitTicket($event)"
        (confirmExitClick)="confirmExit()"
        (calculateSalaryClick)="onCalculateSalary()"
        (printSummaryClick)="printSummary()"
        (allowExitWithoutCollectClick)="allowExitWithoutCollect()"
        (collectCashierClick)="collectCashier()"
        (confirmCashierClicked)="collectCashier()"
      ></app-exit-scan-collect-block-component>
    </div>

    <!-- Block 3: Tickets Table -->
    <div class="col-12 col-md-6 col-lg-4">
      <app-exit-tickets-table-block-component
        [tickets]="filtered"
        [page]="page"
        [pageSize]="pageSize"
        [loading]="loading"
        [totalPriceToday]="totalPriceToday"
        [collectSummary]="collectSummary"
        [collectLoading]="collectLoading"
        [supervisorCollectLoading]="supervisorCollectLoading"
        [supervisorCollectError]="supervisorCollectError"
        [showSupervisorCollectModal]="showSupervisorCollectModal"
        [supervisorUsername]="supervisorUsername"
        [supervisorPassword]="supervisorPassword"
        (pageChange)="page = $event"
        (collectClick)="onCollectClick()"
        (collectSummaryClose)="collectSummary = null"
        (supervisorUsernameChange)="supervisorUsername = $event"
        (supervisorPasswordChange)="supervisorPassword = $event"
        (submitSupervisorCollect)="submitSupervisorCollect()"
        (closeSupervisorCollectModal)="closeSupervisorCollectModal()"
        (finishSupervisorCollect)="finishSupervisorCollect()"
        (ticketSelected)="onTicketSelected($event)"
      ></app-exit-tickets-table-block-component>
    </div>

  </div>

  <!-- Supervisor Login Modal (Global Context Shared) -->
  <app-supervisor-modal-block-component
    [show]="showSupervisorCollectModal && !collectSummary"
    [loading]="supervisorCollectLoading"
    [error]="supervisorCollectError"
    [(username)]="supervisorUsername"
    [(password)]="supervisorPassword"
    (submit)="submitSupervisorCollect()"
    (close)="closeSupervisorCollectModal()"
  ></app-supervisor-modal-block-component>
</div>
