<form>
  <div class="row">
    <div class="col-12 col-md-6 mb-3">
      <label class="form-label">Gate Type</label>
      <select
        class="form-select"
        [(ngModel)]="gateType"
        (change)="onGateTypeChange(gateType)"
        name="gateType"
      >
        <option [ngValue]="GateType.Entrance">Entrance</option>
        <option [ngValue]="GateType.Exit">Exit</option>
      </select>
    </div>

    <div class="col-12 col-md-6 mb-3">
      <label class="form-label">Gate</label>
      <select
        class="form-select"
        [(ngModel)]="selectedGate"
        (change)="onGateSelect()"
        name="gateId"
      >
        <option *ngFor="let gate of gates" [value]="gate.gateId">
          {{ gate.gateName }}
        </option>
      </select>
    </div>
  </div>
</form>
