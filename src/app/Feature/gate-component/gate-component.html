<div class="gate-stage" [attr.dir]="dir()">
  <div class="gate-panel">
    <!-- Header -->
    <header class="gate-panel__header">
      <span class="gate-panel__emblem" aria-hidden="true">
        <i class="fa-solid fa-road-barrier"></i>
      </span>
      <div class="gate-panel__headings">
        <h1 class="gate-panel__title">{{ 'gateSelection' | t }}</h1>
        <p class="gate-panel__subtitle">{{ 'selectGate' | t }}</p>
      </div>
    </header>

    <div class="gate-panel__body">
      <!-- Entry Gates Section -->
      <section class="gate-group" *ngIf="entryGates.length > 0">
        <div class="gate-group__header">
          <span class="gate-group__badge gate-group__badge--entry">
            <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
            <span>{{ 'entryGates' | t }}</span>
          </span>
          <span class="gate-group__count" dir="ltr">{{ entryGates.length }}</span>
        </div>

        <div class="gate-cards">
          <button
            type="button"
            class="gate-card gate-card--entry"
            *ngFor="let gate of entryGates"
            [class.is-selected]="selectedGateId === gate.gateId && gateType === GateType.Entrance"
            (click)="selectGate(gate.gateId, GateType.Entrance)"
          >
            <span class="gate-card__icon" aria-hidden="true">
              <i class="fa-solid fa-door-open"></i>
            </span>

            <div class="gate-card__info">
              <span class="gate-card__name">{{ gate.gateName }}</span>
              <span class="gate-card__pill gate-card__pill--entry">
                <i class="fa-solid fa-circle-dot" aria-hidden="true"></i>
                {{ 'entry' | t }}
              </span>
            </div>

            <span class="gate-card__arrow" aria-hidden="true">
              <i
                class="fa-solid"
                [ngClass]="lang.isRTL() ? 'fa-arrow-left' : 'fa-arrow-right'"
              ></i>
            </span>
          </button>
        </div>
      </section>

      <!-- Exit Gates Section -->
      <section class="gate-group" *ngIf="exitGates.length > 0">
        <div class="gate-group__header">
          <span class="gate-group__badge gate-group__badge--exit">
            <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
            <span>{{ 'exitGates' | t }}</span>
          </span>
          <span class="gate-group__count" dir="ltr">{{ exitGates.length }}</span>
        </div>

        <div class="gate-cards">
          <button
            type="button"
            class="gate-card gate-card--exit"
            *ngFor="let gate of exitGates"
            [class.is-selected]="selectedGateId === gate.gateId && gateType === GateType.Exit"
            (click)="selectGate(gate.gateId, GateType.Exit)"
          >
            <span class="gate-card__icon" aria-hidden="true">
              <i class="fa-solid fa-door-closed"></i>
            </span>

            <div class="gate-card__info">
              <span class="gate-card__name">{{ gate.gateName }}</span>
              <span class="gate-card__pill gate-card__pill--exit">
                <i class="fa-solid fa-circle-dot" aria-hidden="true"></i>
                {{ 'exit' | t }}
              </span>
            </div>

            <span class="gate-card__arrow" aria-hidden="true">
              <i
                class="fa-solid"
                [ngClass]="lang.isRTL() ? 'fa-arrow-left' : 'fa-arrow-right'"
              ></i>
            </span>
          </button>
        </div>
      </section>

      <!-- No Gates Empty State -->
      <div class="gate-empty" *ngIf="entryGates.length === 0 && exitGates.length === 0">
        <span class="gate-empty__icon" aria-hidden="true">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </span>
        <p class="gate-empty__text">{{ 'noGates' | t }}</p>
      </div>
    </div>
  </div>
</div>
