<div
  class="parking container-fluid"
  [attr.dir]="lang.dir()"
  [class.page-rtl]="lang.isRTL()"
  [class.page-ltr]="!lang.isRTL()"
>
  <div class="row g-4">
    <div class="col-12">
      <div class="card card--glass shadow-sm h-100">
        <div class="card-header d-flex align-items-center justify-content-between">
          <div class="d-flex align-items-center gap-2">
            <i class="bi bi-bezier2"></i>
            <h5 class="mb-0 fw-bold">{{ 'garageMap' | t }}</h5>
          </div>

          <div class="controls d-flex align-items-center gap-2">
            <!-- Floor Switcher -->
            <div class="btn-group floor-switcher" role="group">
              <button
                type="button"
                class="btn btn-sm"
                [class.btn-primary]="currentFloor() === 'B1'"
                [class.btn-outline-secondary]="currentFloor() !== 'B1'"
                (click)="switchSvg('B1')"
              >
                {{ 'planB1' | t }}
              </button>
              <button
                type="button"
                class="btn btn-sm"
                [class.btn-primary]="currentFloor() === 'B2'"
                [class.btn-outline-secondary]="currentFloor() !== 'B2'"
                (click)="switchSvg('B2')"
              >
                {{ 'planB2' | t }}
              </button>
            </div>

            <!-- Zoom Controls -->
            <div class="btn-group">
              <button
                type="button"
                class="btn btn-outline-secondary btn-sm"
                (click)="zoomOut()"
                [title]="'titleZoomOut' | t"
              >
                <i class="bi bi-dash-lg"></i>
              </button>
              <button
                type="button"
                class="btn btn-outline-secondary btn-sm"
                (click)="resetView()"
                [title]="'titleReset' | t"
              >
                <i class="bi bi-arrow-clockwise"></i>
              </button>
              <button
                type="button"
                class="btn btn-outline-secondary btn-sm"
                (click)="zoomIn()"
                [title]="'titleZoomIn' | t"
              >
                <i class="bi bi-plus-lg"></i>
              </button>
            </div>

            <!-- Zoom Display -->
            <small class="text-muted">{{ zoomPercentage() }}%</small>

            <!-- Export JSON -->
            <button
              type="button"
              class="btn btn-success btn-sm"
              (click)="exportJson()"
              [title]="'titleExport' | t"
            >
              <i class="bi bi-download"></i>
            </button>
          </div>
        </div>

        <div class="card-body p-0">
          <div class="svg-wrap">
            <div #svgHost class="svg-host" [innerHTML]="sanitizedSvg"></div>
          </div>
        </div>
      </div>
    </div>
