<div class="app-shell" [attr.dir]="dir()">
  <!-- Sidebar -->
  <aside class="app-sidebar" [class.collapsed]="sidebarCollapsed()">
    <!-- Sidebar Header -->
    <div class="sidebar-header">
      <a class="brand" routerLink="/" *ngIf="!sidebarCollapsed()">
        <span class="brand-n">N</span><span class="brand-park">Park</span>
      </a>
      <a class="brand-icon me-1" routerLink="/" *ngIf="sidebarCollapsed()">
        <span class="brand-n">N</span>
      </a>

      <!-- Toggle Button -->
      <button
        class="sidebar-toggle"
        (click)="toggleSidebar()"
        [attr.aria-label]="sidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      >
        <i class="bi" [ngClass]="sidebarCollapsed() ? 'bi-chevron-right' : 'bi-chevron-left'"></i>
      </button>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
      <!-- Overview — Admin  -->
      <a
        *ngIf="isAdmin"
        class="nav-item"
        routerLink="/overview"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        [attr.title]="sidebarCollapsed() ? t('overview') : null"
      >
        <i class="bi bi-house"></i>
        <span class="nav-text" *ngIf="!sidebarCollapsed()">{{ t('overview') }}</span>
      </a>

      <!-- Parking section — Admin +EntranceCashier + ExitCashier + Supervisor -->
      <div
        class="nav-section-title"
        *ngIf="
          (isAdmin || isEntranceCashier || isExitCashier || isSupervisor) && !sidebarCollapsed()
        "
      >
        {{ t('parking') }}
      </div>

      <!-- Gate with submenu -->
      <div class="nav-group" *ngIf="isAdmin || isEntranceCashier || isExitCashier || isSupervisor">
        <button
          class="nav-item nav-toggle"
          type="button"
          (click)="toggleGate()"
          [attr.aria-expanded]="gateOpen"
          [attr.title]="sidebarCollapsed() ? t('gate') : null"
        >
          <i class="bi bi-door-open"></i>
          <span class="nav-text" *ngIf="!sidebarCollapsed()">{{ t('gate') }}</span>
          <i
            class="expand-icon bi"
            [ngClass]="gateOpen ? 'bi-chevron-up' : 'bi-chevron-down'"
            *ngIf="!sidebarCollapsed()"
          ></i>
        </button>

        <div class="submenu" *ngIf="gateOpen && !sidebarCollapsed()">
          <!-- Entry Gate — Admin + EntranceCashier + Supervisor -->
          <a
            *ngIf="isAdmin || isEntranceCashier || isSupervisor"
            class="nav-item submenu-item"
            routerLink="/tickets/entry"
            routerLinkActive="active"
          >
            <i class="bi bi-arrow-right-circle"></i>
            <span class="nav-text">{{ t('entryGate') }}</span>
          </a>

          <!-- Exit Gate — Admin + ExitCashier + Supervisor -->
          <a
            *ngIf="isAdmin || isExitCashier || isSupervisor"
            class="nav-item submenu-item"
            routerLink="/tickets/exit"
            routerLinkActive="active"
          >
            <i class="bi bi-box-arrow-right"></i>
            <span class="nav-text">{{ t('exitGate') }}</span>
          </a>
        </div>
      </div>

      <!-- Visitor (Admin فقط) -->
      <a
        *ngIf="isAdmin"
        class="nav-item"
        routerLink="/visitor"
        routerLinkActive="active"
        [attr.title]="sidebarCollapsed() ? t('visitor') : null"
      >
        <i class="bi bi-person-vcard"></i>
        <span class="nav-text" *ngIf="!sidebarCollapsed()">{{ t('visitor') }}</span>
      </a>

      <!-- Altaeriffa -->
      <a
        *ngIf="isAdmin"
        class="nav-item"
        routerLink="/Altaeriffa"
        routerLinkActive="active"
        [attr.title]="sidebarCollapsed() ? t('altaeriffa') : null"
      >
        <i class="bi bi-tags-fill"></i>
        <span class="nav-text" *ngIf="!sidebarCollapsed()">{{ t('altaeriffa') }}</span>
      </a>

      <!-- Subscription -->
      <a
        *ngIf="isAdmin"
        class="nav-item"
        routerLink="/registration"
        routerLinkActive="active"
        [attr.title]="sidebarCollapsed() ? t('subscription') : null"
      >
        <i class="bi bi-person-badge"></i>
        <span class="nav-text" *ngIf="!sidebarCollapsed()">{{ t('subscription') }}</span>
      </a>

      <!-- Management Section -->
      <div class="nav-section-title" *ngIf="isAdmin && !sidebarCollapsed()">
        {{ t('management') }}
      </div>

      <!-- Users -->
      <a
        *ngIf="isAdmin"
        class="nav-item"
        routerLink="/users"
        routerLinkActive="active"
        [attr.title]="sidebarCollapsed() ? t('users') : null"
      >
        <i class="bi bi-people-fill"></i>
        <span class="nav-text" *ngIf="!sidebarCollapsed()">{{ t('users') }}</span>
      </a>

      <!-- Configuration -->
      <a
        *ngIf="isAdmin"
        class="nav-item"
        routerLink="/configuration"
        routerLinkActive="active"
        [attr.title]="sidebarCollapsed() ? t('configuration') : null"
      >
        <i class="bi bi-sliders"></i>
        <span class="nav-text" *ngIf="!sidebarCollapsed()">{{ t('configuration') }}</span>
      </a>

      <!-- Parking Guidance Diagram -->
      <!-- <a
        *ngIf="isAdmin"
        class="nav-item"
        routerLink="/parking-guidance-diagram"
        routerLinkActive="active"
        [attr.title]="sidebarCollapsed() ? t('parkingGuidanceDiagram') : null"
      >
        <i class="bi bi-map-fill"></i>
        <span class="nav-text" *ngIf="!sidebarCollapsed()">{{ t('parkingGuidanceDiagram') }}</span>
      </a> -->
    </nav>

    <!-- Sidebar Footer -->
    <div class="sidebar-footer" *ngIf="!sidebarCollapsed()">
      <div class="version-text">{{ t('version') }} 1.0</div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="app-content">
    <app-header-component></app-header-component>
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
    <app-footer-component></app-footer-component>
  </main>
</div>
