<div class="app-shell" [attr.dir]="dir()">
  <!-- Sidebar -->
  <app-sidebar-component
    [collapsed]="effectiveSidebarCollapsed()"
    (toggle)="toggleSidebar()"
  ></app-sidebar-component>

  <!-- Main Content -->
  <main class="app-content" [class.headerless]="!shouldShowHeader">
    <app-header-component *ngIf="shouldShowHeader"></app-header-component>
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
    <app-footer-component></app-footer-component>
  </main>
</div>
