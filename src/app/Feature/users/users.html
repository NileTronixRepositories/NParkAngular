<div class="users-theme container-fluid" [class.page-rtl]="isRTL()" [attr.dir]="dir()">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0 fw-bold">{{ t('users') }}</h4>
    <button class="btn btn-primary" (click)="openAdd()">
      <i class="bi bi-plus-lg me-1"></i> {{ t('add_new') }}
    </button>
  </div>

  <div class="card shadow-soft mb-3">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead class="table-head">
            <tr>
              <th style="width: 80px">{{ t('id') }}</th>
              <th>{{ t('name') }}</th>
              <th>{{ t('email') }}</th>
              <th style="width: 120px">{{ t('role') }}</th>
              <th style="width: 120px">{{ t('actions') }}</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let u of users; trackBy: trackById">
              <td>{{ u.id }}</td>
              <td class="mono">{{ u.userName }}</td>
              <td class="mono">{{ u.email }}</td>
              <td>
                <span class="badge theme-amber" *ngIf="u.roleName === 'Admin'">
                  {{ t('admin') }}
                </span>
                <span class="badge theme-blue" *ngIf="u.roleName !== 'Admin'">
                  {{ u.roleName }}
                </span>
              </td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-primary me-2" (click)="openEdit(u)">
                  <i class="bi bi-pencil"></i> {{ t('edit') }}
                </button>
              </td>
            </tr>

            <tr *ngIf="!users.length && !loading">
              <td colspan="5" class="text-center text-muted py-4">
                {{ t('no_users') }}
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div *ngIf="loading" class="p-3 text-muted">{{ t('loading') }}</div>
    </div>
  </div>

  <!-- Inline Form Card -->
  <div class="card shadow-soft mb-4" *ngIf="showForm">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
      <strong>{{ isEdit ? t('edit_user') : t('add_user') }}</strong>
      <button class="btn btn-sm btn-outline-secondary" (click)="cancel()" [disabled]="saving">
        {{ t('close') }}
      </button>
    </div>

    <div class="card-body">
      <form (ngSubmit)="save()">
        <div class="row g-3">
          <!-- User Name -->
          <div class="col-md-4">
            <label class="form-label">{{ t('name') }}</label>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="model.userName"
              name="userName"
              required
              [readonly]="isEdit"
              [disabled]="saving"
            />
          </div>

          <!-- Email -->
          <div class="col-md-4">
            <label class="form-label">{{ t('email') }}</label>
            <input
              type="email"
              class="form-control"
              [(ngModel)]="model.email"
              name="email"
              required
              [disabled]="saving"
            />
          </div>

          <!-- Role (Edit: read-only name, Add: roleId) -->
          <div class="col-md-4" *ngIf="isEdit">
            <label class="form-label">{{ t('role') }}</label>
            <input type="text" class="form-control" [value]="model.roleName" readonly disabled />
          </div>

          <div class="col-md-4" *ngIf="!isEdit">
            <label class="form-label">{{ t('role') }}</label>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="model.roleId"
              name="roleId"
              required
              [disabled]="saving"
            />
            <small class="form-text text-muted">{{ t('role_hint') }}</small>
          </div>

          <!-- Password (Add only) -->
          <div class="col-md-4" *ngIf="!isEdit">
            <label class="form-label">{{ t('password') }}</label>
            <input
              type="password"
              class="form-control"
              [(ngModel)]="model.password"
              name="password"
              required
              [disabled]="saving"
            />
          </div>

          <!-- Phone (Add only) -->
          <div class="col-md-4" *ngIf="!isEdit">
            <label class="form-label">{{ t('phone') }}</label>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="model.phoneNumber"
              name="phoneNumber"
              required
              [disabled]="saving"
            />
          </div>

          <!-- National ID (Add only) -->
          <div class="col-md-4" *ngIf="!isEdit">
            <label class="form-label">{{ t('nationalId') }}</label>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="model.nationalId"
              name="nationalId"
              required
              [disabled]="saving"
            />
          </div>
        </div>

        <div class="mt-3 d-flex align-items-center gap-2">
          <button class="btn btn-success" type="submit" [disabled]="saving">
            <i class="bi" [ngClass]="isEdit ? 'bi-save' : 'bi-plus-lg'"></i>
            {{ saving ? t('saving') : isEdit ? t('save') : t('create') }}
          </button>
          <button
            class="btn btn-outline-secondary"
            type="button"
            (click)="cancel()"
            [disabled]="saving"
          >
            {{ t('cancel') }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
