<div class="users-theme container-fluid" [class.page-rtl]="isRTL()" [attr.dir]="dir()">
  <!-- Header + Help Tour -->
  <div class="users-header d-flex justify-content-between align-items-center mb-3">
    <div class="d-flex align-items-center gap-2">
      <span class="users-header-pill">
        <span class="users-header-dot"></span>
        <span class="users-header-pill-text">{{ t('users') }}</span>
      </span>
      <h4 class="mb-0 fw-bold users-header-title">{{ t('users') }}</h4>
    </div>

    <div class="d-flex align-items-center gap-2">
      <!-- Help Tour button -->
      <button type="button" class="btn btn-light btn-help-tour-users" (click)="startUsersTour()">
        <i class="bi bi-question-circle me-1"></i>
        <span class="d-none d-sm-inline">{{ 'Help tour' }}</span>
      </button>

      <!-- Add button -->
      <button class="btn btn-primary btn-users-add" type="button" (click)="openAdd()">
        <i class="bi bi-plus-lg me-1"></i> {{ t('add_new') }}
      </button>
    </div>
  </div>

  <!-- Table card -->
  <div class="card shadow-soft users-table-card mb-3">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead class="table-head">
            <tr>
              <!-- <th style="width: 80px">{{ t('id') }}</th> -->
              <th>{{ t('name') }}</th>
              <th>{{ t('email') }}</th>
              <th style="width: 140px">{{ t('role') }}</th>
              <th style="width: 130px" class="text-end">
                {{ t('actions') }}
              </th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let u of users; trackBy: trackById">
              <!-- <td>{{ u.id }}</td> -->
              <td class="mono">{{ u.userName }}</td>
              <td class="mono">{{ u.email }}</td>
              <td>
                <span class="badge theme-amber" *ngIf="u.roleName === 'Admin'">
                  {{ t('admin') }}
                </span>
                <span class="badge theme-blue" *ngIf="u.roleName !== 'Admin'">
                  {{ u.roleName }}
                </span>
              </td>
              <td class="text-end">
                <div class="btn-group btn-group-sm users-row-actions" role="group">
                  <button class="btn btn-outline-primary" type="button" (click)="openEdit(u)">
                    <i class="bi bi-pencil"></i> {{ t('edit') }}
                  </button>
                </div>
              </td>
            </tr>

            <tr *ngIf="!users.length && !loading">
              <td colspan="5" class="text-center text-muted py-4">
                {{ t('no_users') }}
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div *ngIf="loading" class="p-3 text-muted">{{ t('loading') }}</div>
    </div>
  </div>

  <!-- Inline Form Card -->
  <div class="card shadow-soft users-form-card mb-4" *ngIf="showForm">
    <div class="card-header bg-white d-flex justify-content-between align-items-center py-2 px-3">
      <strong class="small">
        {{ isEdit ? t('edit_user') : t('add_user') }}
      </strong>
      <button
        class="btn btn-sm btn-outline-secondary"
        type="button"
        (click)="cancel()"
        [disabled]="saving"
      >
        {{ t('close') }}
      </button>
    </div>

    <div class="card-body py-3 px-3">
      <form (ngSubmit)="save()">
        <div class="row g-3">
          <!-- Name -->
          <div class="col-md-4">
            <label class="form-label small mb-1">{{ t('name') }}</label>
            <input
              type="text"
              class="form-control form-control-sm"
              [(ngModel)]="model.userName"
              name="userName"
              required
              [disabled]="saving"
            />
          </div>

          <!-- Email -->
          <div class="col-md-4">
            <label class="form-label small mb-1">{{ t('email') }}</label>
            <input
              type="email"
              class="form-control form-control-sm"
              [(ngModel)]="model.email"
              name="email"
              required
              [disabled]="saving"
            />
          </div>

          <!-- Role dropdown -->
          <div class="col-md-4">
            <label class="form-label small mb-1">{{ t('role') }}</label>
            <select
              class="form-select form-select-sm users-role-select"
              [(ngModel)]="model.roleId"
              name="roleId"
              required
              [disabled]="saving || rolesLoading"
            >
              <option [ngValue]="''" disabled>{{ t('select_role') }}</option>
              <option *ngFor="let r of roles" [ngValue]="r.id">
                {{ r.name }}
              </option>
            </select>
            <small class="form-text text-muted d-block mt-1" *ngIf="!isEdit">
              {{ t('role_hint') }}
            </small>
          </div>

          <!-- Password -->
          <div class="col-md-4" *ngIf="!isEdit">
            <label class="form-label small mb-1">{{ t('password') }}</label>
            <input
              type="password"
              class="form-control form-control-sm users-password-input"
              [(ngModel)]="model.password"
              name="password"
              required
              [disabled]="saving"
            />
          </div>

          <!-- Phone -->
          <div class="col-md-4" *ngIf="!isEdit">
            <label class="form-label small mb-1">{{ t('phone') }}</label>
            <input
              type="text"
              class="form-control form-control-sm"
              [(ngModel)]="model.phoneNumber"
              name="phoneNumber"
              required
              [disabled]="saving"
            />
          </div>

          <!-- National ID -->
          <div class="col-md-4" *ngIf="!isEdit">
            <label class="form-label small mb-1">{{ t('nationalId') }}</label>
            <input
              type="text"
              class="form-control form-control-sm"
              [(ngModel)]="model.nationalId"
              name="nationalId"
              required
              [disabled]="saving"
            />
          </div>
        </div>

        <div class="mt-3 d-flex align-items-center gap-2">
          <button class="btn btn-success btn-sm users-btn-save" type="submit" [disabled]="saving">
            <i class="bi me-1" [ngClass]="isEdit ? 'bi-save' : 'bi-plus-lg'"></i>
            {{ saving ? t('saving') : isEdit ? t('save') : t('create') }}
          </button>
          <button
            class="btn btn-outline-secondary btn-sm"
            type="button"
            (click)="cancel()"
            [disabled]="saving"
          >
            {{ t('cancel') }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
