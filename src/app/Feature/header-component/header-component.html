<nav
  class="navbar app-header navbar-expand-lg navbar-light bg-white"
  [attr.dir]="lang.dir()"
  [class.page-rtl]="lang.isRTL()"
>
  <div class="container-fluid header-inner">
    <div class="header-start">
      <button
        *ngIf="showMenuToggle"
        type="button"
        class="header-menu-btn"
        (click)="onToggleMenu()"
        [attr.aria-expanded]="menuOpen"
        [attr.aria-label]="lang.isRTL() ? 'القائمة' : 'Menu'"
      >
        <i class="fa-solid" [ngClass]="menuOpen ? 'fa-xmark' : 'fa-bars'" aria-hidden="true"></i>
      </button>

      <a class="navbar-brand" routerLink="/overview" aria-label="NPark">
        <span class="brand-n">N</span><span class="brand-park">Park</span>
      </a>
    </div>

    <div class="header-actions">
      <button type="button" class="header-btn lang-btn" (click)="switchLang()">
        <i class="fa-solid fa-language"></i>
        <span>{{ langLabel }}</span>
      </button>

      <button type="button" class="header-btn logout-btn" (click)="logout()">
        <i
          class="fa-solid"
          [ngClass]="
            lang.isRTL() ? 'fa-right-from-bracket fa-flip-horizontal' : 'fa-right-from-bracket'
          "
        ></i>
        <span>{{ logoutLabel }}</span>
      </button>
    </div>
  </div>
</nav>
